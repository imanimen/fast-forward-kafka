services:
  kafka-controller:
    image: apache/kafka:3.9.0
    # container_name: kafka-controller
    # restart: unless-stopped
    # stop_grace_period: 60s
    # ports:
    #   - "9092:9092"
    # followed by the conventions
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: kafka-cluster
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  kafka-broker-1:
      image: apache/kafka:3.9.0
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 2
        CLUSTER_ID: kafka-cluster
        KAFKA_PROCESS_ROLES: broker
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
        KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:19092,EXTERNAL://localhost:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      depends_on:
        - kafka-controller
  kafka-broker-2:
      image: apache/kafka:3.9.0
      ports:
        - "9093:9092"
      environment:
        KAFKA_NODE_ID: 3
        CLUSTER_ID: kafka-cluster
        KAFKA_PROCESS_ROLES: broker
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
        KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:19092,EXTERNAL://localhost:9093
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      depends_on:
        - kafka-controller        
  kafka-broker-3:
      image: apache/kafka:3.9.0
      ports:
        - "9094:9092"
      environment:
        KAFKA_NODE_ID: 4
        CLUSTER_ID: kafka-cluster
        KAFKA_PROCESS_ROLES: broker
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
        KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:19092,EXTERNAL://localhost:9094
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      depends_on:
        - kafka-controller        


